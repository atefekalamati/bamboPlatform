services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bambo
      POSTGRES_USER: bambo
      POSTGRES_PASSWORD: bambo
    ports:
      - "5432:5432"
    volumes:
      - bambo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambo -d bambo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bambo_postgres_data:
