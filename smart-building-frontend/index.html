<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="سامانه مدیریت چک‌لیست و فرایند پایلوت BAMBO"
    />
    <title>BAMBO Pilot</title>
    <link rel="icon" href="./src/assets/images/Logo Sign.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles/index.css" />

    <script>
      (function () {
        var THEME_KEY = "bambo_theme";
        var stored = localStorage.getItem(THEME_KEY);
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

  </head>
  <body>
    <a class="skip-link" href="#main-content">رفتن به محتوای اصلی</a>
    <div id="app" aria-live="polite"></div>
    <noscript>
      برای استفاده از سامانه BAMBO Pilot باید JavaScript مرورگر فعال باشد.
    </noscript>
    <script type="module" src="./src/app/bootstrap.js"></script>
  </body>
</html>
