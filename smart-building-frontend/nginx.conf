server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = /index.html { expires -1; try_files $uri =404; }
  location = /runtime-config.js { expires epoch; try_files $uri =404; }
  location ~* ^/(tests|docs|scripts|\.git|src/documents)/ { return 404; }

  location /backend/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://bambo-backend:8000;
    rewrite ^/backend/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_hide_header Server;
  }

  location ~* \.(woff2|svg|png|jpg|jpeg|webp|css|js)$ {
    expires 1h;
    try_files $uri =404;
  }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
