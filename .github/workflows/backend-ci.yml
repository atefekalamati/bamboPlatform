name: Backend CI

on:
  pull_request:
    paths:
      - "smart-building-backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - master
    paths:
      - "smart-building-backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  static-security-image:
    name: Static, dependency and image checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: smart-building-backend/requirements.lock
      - name: Compile and audit Python dependencies
        working-directory: smart-building-backend
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install --require-hashes -r requirements.lock
          python -m compileall -q app tests
          python -m pip_audit -r requirements.lock
      - name: Build immutable-candidate image
        uses: docker/build-push-action@v6
        with:
          context: smart-building-backend
          file: smart-building-backend/Dockerfile
          push: false
          load: true
          tags: bambo-backend:${{ github.sha }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: bambo-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.4
        with:
          image: bambo-backend:${{ github.sha }}
          artifact-name: bambo-backend-${{ github.sha }}.spdx.json

  sqlite-tests:
    name: SQLite tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: smart-building-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: smart-building-backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Run test suite
        run: python -m pytest -q

  postgresql-integration:
    name: PostgreSQL migration and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bambo_ci
          POSTGRES_USER: bambo_ci
          POSTGRES_PASSWORD: bambo_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bambo_ci -d bambo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://bambo_ci:bambo_ci_password@localhost:5432/bambo_ci
      # Names the server, not the database under test. The integration suite
      # creates its own bambo_test_<id>, migrates it, and drops it afterwards,
      # so bambo_ci stays clean for the migration-chain step below.
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://bambo_ci:bambo_ci_password@localhost:5432/bambo_ci
      APP_ENV: test
      AUTH_SECRET: ci-only-secret-not-for-production
      DWG_MAX_BYTES: "1048576"

    defaults:
      run:
        working-directory: smart-building-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: smart-building-backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Upgrade PostgreSQL schema
        run: python -m alembic upgrade head

      - name: Check PostgreSQL schema drift
        run: python -m alembic check

      # Twice: a suite that only passes on a pristine database passes the first
      # run and fails the second. Running it back to back is what proves the
      # per-session database is really isolated and really torn down.
      - name: Run PostgreSQL integration test
        run: python -m pytest tests/test_postgres_integration.py -q
        env:
          DWG_STORAGE_ROOT: ${{ runner.temp }}/dwg-storage

      - name: Re-run PostgreSQL integration test to prove isolation
        run: python -m pytest tests/test_postgres_integration.py -q
        env:
          DWG_STORAGE_ROOT: ${{ runner.temp }}/dwg-storage

      - name: Assert no throwaway test database survived
        run: |
          leftovers=$(psql "postgresql://bambo_ci:bambo_ci_password@localhost:5432/postgres" \
            -tAc "SELECT count(*) FROM pg_database WHERE datname LIKE 'bambo_test_%'")
          echo "leftover test databases: $leftovers"
          test "$leftovers" -eq 0

      - name: Assert the integration suite left bambo_ci alone
        run: |
          pilots=$(psql "$DATABASE_URL_PLAIN" -tAc "SELECT count(*) FROM pilots")
          echo "pilots in bambo_ci: $pilots"
          test "$pilots" -eq 0
        env:
          DATABASE_URL_PLAIN: postgresql://bambo_ci:bambo_ci_password@localhost:5432/bambo_ci

      - name: Verify reversible migration chain
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
